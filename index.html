<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Taxatieopname</title>
  <meta name="theme-color" content="#042a43" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "black-translucent" (tot 15-09-2026) liet de statusbalk als een doorzichtige laag BOVENOP de
       pagina-inhoud tekenen — iOS voegt daar zelf een wazig/vervagend overlay-effect aan toe voor de
       leesbaarheid van de klok/pictogrammen, ongeacht onze eigen CSS (geen paddingtruc lost dat op,
       het is een systeemeffect). Arno's melding "kop is wazig" 15-09-2026 hierop terug te voeren.
       "black" is een solide, ondoorzichtige statusbalk — geen doorschemer-effect meer, wel een knip
       tussen de zwarte statusbalk en onze navy kop (geen naadloze kleur meer tot boven de notch). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Taxatieopname" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CACHEBUST (18-09-2026): GitHub Pages stuurt Cache-Control: max-age=600 mee voor app.js/
       style.css — zonder een query-string die per deploy verandert, blijft de browser tot 10 minuten
       na een update alsnog de OUDE versie serveren aan dit <script src>/<link href>, ook na een
       harde herlaadbeurt (de service worker zelf werkt wél meteen bij, maar dat helpt niet als de
       browser de fetch daaronder al uit z'n eigen HTTP-cache beantwoordt vóórdat de SW 'm ziet).
       Bump CACHEBUST bij elke deploy die app.js/style.css wijzigt, dan is de nieuwe versie altijd
       meteen zichtbaar i.p.v. pas na ~10 minuten wachten. -->
  <link rel="stylesheet" href="style.css?v=20260919i" />
</head>
<body>
  <div id="app"></div>

  <!-- jsPDF voor het PDF-opnamerapport (renderControleTab > genereerRapportPdf in app.js) — bewust
       via CDN i.p.v. vendoren: enige externe afhankelijkheid van de app, alleen nodig op het moment
       dat Arno zelf op "Rapport genereren" klikt. LET OP: werkt dus niet zonder internet als de
       browser 'm nog niet eerder gecachet heeft (de service worker cachet alleen bestanden van dit
       eigen domein, geen CDN's — zie sw.js). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="db.js?v=20260919i"></script>
  <script src="app.js?v=20260919i"></script>
</body>
</html>
