  <!-- "black-translucent" (tot 15-09-2026) liet de statusbalk als een doorzichtige laag BOVENOP de
       pagina-inhoud tekenen — iOS voegt daar zelf een wazig/vervagend overlay-effect aan toe voor de
       leesbaarheid van de klok/pictogrammen, ongeacht onze eigen CSS (geen paddingtruc lost dat op,
       het is een systeemeffect). Arno's melding "kop is wazig" 15-09-2026 hierop terug te voeren.
       "black" is een solide, ondoorzichtige statusbalk — geen doorschemer-effect meer, wel een knip
       tussen de zwarte statusbalk en onze navy kop (geen naadloze kleur meer tot boven de notch). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Taxatieopname" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
